<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture</title>
<desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routes, libraries, config and JSON database, including the numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
  <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#475569}
    .section{font-size:15px;font-weight:700;fill:#334155;letter-spacing:.5px}
    .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.ui{fill:#eff6ff;stroke:#60a5fa}
    .data{fill:#f8fafc;stroke:#64748b}.focus{fill:#fff7ed;stroke:#f97316;stroke-width:2}
    .head{font-size:15px;font-weight:700}.small{font-size:12px;fill:#475569}
    .edge{stroke:#64748b;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
    .flow{stroke:#2563eb;stroke-width:2.4;fill:none;marker-end:url(#flowArrow)}
    .pill{fill:#dbeafe;stroke:#93c5fd}.pillText{font-size:12px;font-weight:700;fill:#1d4ed8}
    .step{font-size:12px;font-weight:700;fill:#1d4ed8}
  </style>
</defs>
<rect width="1200" height="800" fill="#f8fafc"/>
<text x="34" y="42" class="title">ShopLedger | application architecture</text>
<text x="34" y="66" class="subtitle">Browser POS · Express API · JSON file persistence</text>

<!-- order flow overlay -->
<rect x="34" y="88" width="1132" height="158" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="52" y="114" class="section">ORDER PLACEMENT FLOW</text>
<g>
  <rect x="53" y="130" width="158" height="70" rx="9" class="box ui"/>
  <circle cx="69" cy="145" r="11" fill="#2563eb"/><text x="65.5" y="149" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="85" y="151" class="head">public/js/app.js</text><text x="66" y="174" class="small">place click → POST</text><text x="66" y="190" class="small">/api/orders</text>

  <rect x="250" y="130" width="176" height="70" rx="9" class="box"/>
  <circle cx="266" cy="145" r="11" fill="#2563eb"/><text x="262.5" y="149" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="282" y="151" class="head">routes/orders.js</text><text x="263" y="174" class="small">resolve item IDs, qty</text><text x="263" y="190" class="small">check stock + coupon</text>

  <rect x="465" y="130" width="215" height="70" rx="9" class="box"/>
  <circle cx="481" cy="145" r="11" fill="#2563eb"/><text x="477.5" y="149" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="497" y="151" class="head">pricing + tax + coupons</text><text x="478" y="174" class="small">pricing.computeTotals()</text><text x="478" y="190" class="small">HSN GST; coupon discount</text>

  <rect x="719" y="130" width="183" height="70" rx="9" class="box focus"/>
  <circle cx="735" cy="145" r="11" fill="#2563eb"/><text x="731.5" y="149" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="751" y="151" class="head">ledger.js (Khata)</text><text x="732" y="174" class="small">chargeOrderToKhata()</text><text x="732" y="190" class="small">credit check + customer update</text>

  <rect x="941" y="130" width="203" height="70" rx="9" class="box"/>
  <circle cx="957" cy="145" r="11" fill="#2563eb"/><text x="953.5" y="149" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="973" y="151" class="head">inventory → orders</text><text x="954" y="174" class="small">reserve(); orders.add()</text><text x="954" y="190" class="small">appendAudit(); store.write()</text>
  <path d="M211 165H246" class="flow"/><path d="M426 165H461" class="flow"/><path d="M680 165H715" class="flow"/><path d="M902 165H937" class="flow"/>
</g>

<text x="34" y="278" class="section">APPLICATION COMPONENTS</text>
<!-- UI and server -->
<rect x="34" y="298" width="210" height="105" rx="10" class="box ui"/>
<text x="50" y="324" class="head">Browser UI · public/</text>
<text x="50" y="347" class="small">index.html · js/app.js</text><text x="50" y="365" class="small">css/style.css</text>
<text x="50" y="389" class="small">POS · orders · Khata · audit</text>
<rect x="290" y="298" width="215" height="105" rx="10" class="box"/>
<text x="307" y="324" class="head">server.js · Express</text>
<text x="307" y="347" class="small">bodyParser.json()</text><text x="307" y="365" class="small">serves public/ · mounts /api</text>
<text x="307" y="389" class="small">GET /orders/:id/invoice</text>
<path d="M244 350H286" class="edge"/>

<!-- routers -->
<text x="540" y="306" class="section">routes/ · mounted at /api</text>
<rect x="540" y="319" width="285" height="49" rx="8" class="box"/>
<text x="555" y="340" class="head">products.js</text><text x="555" y="358" class="small">GET /products · GET /coupons</text>
<rect x="540" y="378" width="285" height="49" rx="8" class="box"/>
<text x="555" y="399" class="head">orders.js</text><text x="555" y="417" class="small">GET/POST /orders · cancel</text>
<rect x="540" y="437" width="285" height="49" rx="8" class="box focus"/>
<text x="555" y="458" class="head">customers.js</text><text x="555" y="476" class="small">GET /customers · POST /:id/settle</text>
<rect x="540" y="496" width="285" height="49" rx="8" class="box"/>
<text x="555" y="517" class="head">reports.js</text><text x="555" y="535" class="small">dashboard · GST · preview · export</text>
<path d="M505 350H530V343H536" class="edge"/>

<!-- config / db -->
<rect x="916" y="298" width="250" height="76" rx="10" class="box"/>
<text x="934" y="326" class="head">config.js</text><text x="934" y="350" class="small">shop · tax · coupons · port</text>
<rect x="916" y="430" width="250" height="93" rx="10" class="box data"/>
<text x="934" y="458" class="head">data/db.json</text><text x="934" y="482" class="small">products · orders · customers</text><text x="934" y="502" class="small">settlements · auditLog · IDs</text>

<!-- libraries -->
<text x="34" y="578" class="section">lib/ · business logic and persistence</text>
<rect x="34" y="594" width="250" height="58" rx="8" class="box data"/>
<text x="49" y="617" class="head">store.js</text><text x="49" y="638" class="small">read() · write() · appendAudit()</text>

<rect x="303" y="594" width="250" height="58" rx="8" class="box"/>
<text x="318" y="617" class="head">inventory.js</text><text x="318" y="638" class="small">find() · check() · reserve() · release()</text>

<rect x="572" y="594" width="250" height="58" rx="8" class="box"/>
<text x="587" y="617" class="head">pricing.js · tax.js</text><text x="587" y="638" class="small">subtotal() · computeTotals() · GST rates</text>

<rect x="841" y="594" width="325" height="58" rx="8" class="box focus"/>
<text x="856" y="617" class="head">orders.js · list() highlighted</text><text x="856" y="638" class="small">list() only · get() · add() · cancel()</text>

<rect x="34" y="667" width="250" height="58" rx="8" class="box"/>
<text x="49" y="690" class="head">coupons.js</text><text x="49" y="711" class="small">normalizeCode() · validate() · discount</text>

<rect x="303" y="667" width="250" height="58" rx="8" class="box focus"/>
<text x="318" y="690" class="head">dates.js</text><text x="318" y="711" class="small">today() · normalizeDateKey() · FY</text>

<rect x="572" y="667" width="250" height="58" rx="8" class="box focus"/>
<text x="587" y="690" class="head">ledger.js</text><text x="587" y="711" class="small">Khata charge · settlement · reversal</text>

<rect x="841" y="667" width="325" height="58" rx="8" class="box"/>
<text x="856" y="690" class="head">invoice.js · reports.js</text><text x="856" y="711" class="small">render/computeInvoiceFigures · reports</text>

<!-- architecture edges -->
<path d="M680 403V390H825" class="edge"/>
<path d="M825 402H890V470H912" class="edge"/>
<path d="M165 403V560H159V590" class="edge"/>
<path d="M580 430V560H425V590" class="edge"/>
<path d="M680 486V560H698V590" class="edge"/>
<path d="M825 402H866V620H837" class="edge"/>
<path d="M290 373H270V696H299" class="edge"/>
<path d="M284 622H912V505" class="edge"/>
<path d="M825 462H912V490" class="edge"/>
<path d="M690 652V663" class="edge"/>
<path d="M432 652V663" class="edge"/>
<path d="M710 652V663" class="edge"/>

<!-- legend -->
<rect x="34" y="748" width="1132" height="35" rx="8" fill="#fff" stroke="#cbd5e1"/>
<rect x="52" y="759" width="18" height="14" rx="3" class="focus"/><text x="78" y="771" class="small">Ticket focus: orders.js list() only, dates.js, ledger.js, routes/customers.js</text>
<rect x="634" y="759" width="18" height="14" rx="3" class="box"/><text x="660" y="771" class="small">Other app modules</text>
<path d="M810 766H854" class="flow"/><text x="864" y="771" class="small">Numbered order placement path</text>
</svg>
